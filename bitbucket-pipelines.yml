# yaml-language-server: $schema=
# Build + deploy pipeline for the Secure Vault UI.
#
# Default behavior: every push builds + pushes ONE image, tagged with the
# commit SHA. Pushes to `main` additionally auto-deploy to the configured
# `dev` deployment.
#
# Image is built per environment (REACT_APP_* baked in at build time by CRA),
# so the same image SHA only runs in one environment. To promote to another
# env, trigger the matching Custom pipeline (deploy-test / deploy-prod) on
# the same commit — that rebuilds with the env's URLs and redeploys.
#
# Build metadata (Bitbucket build number, build timestamp) is embedded as
# OCI labels in the image — inspect with:
#   docker inspect kittuvittu/secure-vault-ui:<tag> --format '{{ json .Config.Labels }}'
#
# Required Bitbucket variables (per repo + per deployment environment):
#   Repo:
#     DOCKER_PASSWORD (Secured) — Docker Hub push token
#   Per Deployment (dev / test / prod):
#     VPS_USER, VPS_HOST, REMOTE_DIR, LXD_CONTAINER, KUBE_NAMESPACE,
#     APP_NAME, IMAGE_REPO, INGRESS_HOST, LXD_BRIDGE_IP, REPLICAS,
#     REACT_APP_AUTH_BASE_URL, REACT_APP_NOTE_BASE_URL, REACT_APP_AI_BASE_URL,
#     REACT_APP_ROLE_BASE_URL (optional)
# DOCKER_USER is hardcoded below.

image: atlassian/default-image:4

definitions:
  services:
    docker:
      memory: 4096

  steps:
    - step: &build-and-push
        name: Build & push UI image
        size: 2x
        services:
          - docker
        caches:
          - docker
        script:
          - export DOCKER_USER=kittuvittu
          - export IMAGE_REPO=${IMAGE_REPO:-kittuvittu/secure-vault-ui}
          - export IMAGE_TAG=${BITBUCKET_COMMIT}
          - export BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin

          # REACT_APP_* are CRA build args — baked into the JS bundle.
          # Default to localhost if a deployment variable isn't set so a
          # plain push-to-feature-branch still builds; deploys will fail
          # loudly downstream if the URLs are wrong.
          - >-
            docker build
            --build-arg REACT_APP_AUTH_BASE_URL="${REACT_APP_AUTH_BASE_URL:-http://localhost:3211}"
            --build-arg REACT_APP_ROLE_BASE_URL="${REACT_APP_ROLE_BASE_URL:-http://localhost:3212}"
            --build-arg REACT_APP_NOTE_BASE_URL="${REACT_APP_NOTE_BASE_URL:-http://localhost:3213}"
            --build-arg REACT_APP_AI_BASE_URL="${REACT_APP_AI_BASE_URL:-http://localhost:8001}"
            --build-arg GIT_COMMIT="$IMAGE_TAG"
            --build-arg BUILD_NUMBER="$BITBUCKET_BUILD_NUMBER"
            --build-arg BUILD_DATE="$BUILD_DATE"
            -t "${IMAGE_REPO}:${IMAGE_TAG}"
            .

          - docker push "${IMAGE_REPO}:${IMAGE_TAG}" | tee push.log

          - |
            export IMAGE_DIGEST=$(awk '/digest: sha256:/{print $3; exit}' push.log)
          - >-
            test -n "$IMAGE_DIGEST" || {
              echo "ERROR: failed to extract image digest from push output" >&2
              cat push.log >&2; exit 1;
            }

          - 'echo ""'
          - 'echo "================================================================"'
          - 'echo " IMAGE_REPO    : ${IMAGE_REPO}"'
          - 'echo " IMAGE_TAG     : ${IMAGE_TAG}"'
          - 'echo " IMAGE_DIGEST  : ${IMAGE_DIGEST}"'
          - 'echo " BRANCH        : ${BITBUCKET_BRANCH}"'
          - 'echo "================================================================"'
          - 'echo ""'

          - |
            cat > build.env <<EOF
            IMAGE_REPO=${IMAGE_REPO}
            IMAGE_TAG=${IMAGE_TAG}
            IMAGE_DIGEST=${IMAGE_DIGEST}
            BRANCH=${BITBUCKET_BRANCH}
            BUILD_DATE=${BUILD_DATE}
            EOF
        artifacts:
          - build.env
          - push.log

    - step: &deploy
        name: Deploy via ci/deploy.sh
        script:
          # Pull build.env from the previous step so IMAGE_TAG matches what
          # was actually pushed.
          - set -a; source build.env; set +a
          - export APP_NAME="${APP_NAME:-secure-vault-ui}"
          - chmod +x ci/deploy.sh ci/deploy-remote.sh
          - ./ci/deploy.sh

pipelines:
  branches:
    # Every push to `main` builds + auto-deploys to the primary dev cluster.
    # Promote to dev-b / test / stage / prod via the Custom triggers below
    # so each environment gets its own clean build with the right
    # REACT_APP_* values baked in.
    main:
      - step: *build-and-push
      - step:
          <<: *deploy
          deployment: dev-a

    'feature/*':
      - step: *build-and-push

    develop:
      - step: *build-and-push

    'release/*':
      - step: *build-and-push

  # Hand-triggered promotions. In Bitbucket UI:
  #   Pipelines → Run pipeline → Custom → pick the commit + target.
  # Each one rebuilds the image with the target env's REACT_APP_* URLs
  # so the bundle contains the correct backend hosts.
  custom:
    deploy-dev-a:
      - step: *build-and-push
      - step:
          <<: *deploy
          deployment: dev-a

    deploy-dev-b:
      - step: *build-and-push
      - step:
          <<: *deploy
          deployment: dev-b

    deploy-test:
      - step: *build-and-push
      - step:
          <<: *deploy
          deployment: test

    deploy-stage:
      - step: *build-and-push
      - step:
          <<: *deploy
          deployment: stage

    deploy-prod:
      - step: *build-and-push
      - step:
          <<: *deploy
          deployment: prod
