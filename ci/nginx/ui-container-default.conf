# nginx default.conf installed INSIDE the UI container at
# /etc/nginx/conf.d/default.conf by the prod stage of ../../Dockerfile.
#
# Distinct from ./ui.location.conf, which is a snippet for the HOST nginx on
# the VPS. This file runs inside the pod that serves the actual SPA bundle.
#
# The `try_files $uri $uri/ /index.html` line is what makes browser refreshes
# on client-side routes (e.g. /dashboard/create-note, /dashboard/ai-chat) work.
# Without it, nginx returns 404 for any path that isn't a real file under
# /usr/share/nginx/html.
server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Audio uploads on the notes service cap at 25 MB; the UI never proxies
    # them itself, but mirror the limit here so devs running everything
    # through a local nginx aren't surprised by a 413.
    client_max_body_size 25M;
    server_tokens        off;

    # gzip ---------------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # CRA hashed asset filenames are immutable — safe to cache hard.
    location /static/ {
        try_files  $uri =404;
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Root-level hashed files (favicon, manifest, etc.).
    location ~* \.(?:ico|gif|jpe?g|png|webp|woff2?|ttf|eot|otf|svg)$ {
        try_files  $uri =404;
        expires    30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Never cache index.html — it references the latest hashed bundle and must
    # be re-fetched after every deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # k8s probe target. Keep it cheap and never log.
    location = /healthz {
        access_log off;
        return     200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback: any unknown path serves index.html so React Router can
    # take over on the client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
