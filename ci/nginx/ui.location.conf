# nginx location snippet for the UI.
#
# Dropped into /etc/nginx/snippets/${KUBE_NAMESPACE}/ on the VPS by
# ci/deploy-remote.sh and pulled in by the terraform-managed parent vhost via:
#
#   include /etc/nginx/snippets/<cluster>/*.location.conf;
#
# The UI claims "/" — the catch-all for the cluster's hostname. More specific
# paths (e.g. authentication-service's /authentication/, notes-service's
# /notes/) win automatically by nginx's most-specific match rule, so this
# block only handles requests no other snippet claims.
#
# ${LXD_BRIDGE_IP} is substituted at deploy time by ci/deploy.sh — it's the
# IP of the cluster's LXD container on lxdbr0, where Traefik listens on :80.
location / {
    proxy_pass         http://${LXD_BRIDGE_IP}:80;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # WebSocket / HMR upgrades — harmless for plain HTTP and required if the
    # UI ever serves a websocket endpoint behind the same hostname.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
